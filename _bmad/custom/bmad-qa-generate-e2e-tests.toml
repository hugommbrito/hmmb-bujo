# Team override for bmad-qa-generate-e2e-tests.
# Origem: item de ação #1 da retrospectiva do Epic 13
# (_bmad-output/implementation-artifacts/epic-13-retro-2026-07-24.md, Seções 3/5/7).
#
# Por que este arquivo existe: o guardrail de reconciliação de File List já
# estava codificado em _bmad/custom/bmad-dev-story.toml desde o commit d01f961
# (retro do Epic 12) e RECORREU mesmo assim nas Stories 13.1 e 13.2 — porque
# quem cria os arquivos novos é ESTE passo, que roda DEPOIS do dev-story e não
# carrega os persistent_facts dele. O fato precisa morar no workflow que está em
# execução no instante em que a falha acontece.
#
# persistent_facts APPENDS aos fatos da base — não substitui.

[workflow]
persistent_facts = [
  "Antes de encerrar este passo, reconcilie o File List DA STORY contra `git status --short` e `git diff --stat`: todo spec E2E, helper, seed, config ou artefato criado/alterado por VOCÊ entra no File List da story, nomeado como artefato de tipo novo quando for o caso. Revise também qualquer afirmação do dev-story do tipo 'sem E2E novo'/'nenhum arquivo novo' — ela normalmente fica FALSA depois deste passo e precisa ser corrigida no texto da story, não só no File List. Não delegue isso à review: a review é a rede, não o dono. (Retro Epic 13: o guardrail equivalente existia no bmad-dev-story desde d01f961 e recorreu assim mesmo em 13.1 — `frontend/e2e/shell.spec.ts` — e 13.2 — `frontend/e2e/shell-sidebar.spec.ts` + `frontend/e2e/seedBrainDumpItems.ts`; ambos MEDIUM em review, porque o dev-story já tinha terminado quando estes arquivos nasceram. Mesma classe das retros dos Epics 3/4/11/12.)",
  "Se este passo alterar a contagem de testes (unitários ou E2E) que a story reporta em Completion Notes, atualize a contagem NA STORY com a saída literal do comando real e refaça a divisão herdados/novos pelo `git diff` — nunca por subtração. Uma contagem correta no fim do dev-story fica defasada assim que este passo adiciona um teste. (Retro Epic 13: padrão observado nas 13.3 e 13.4, onde o passo de QA somou +14 e +9 testes E2E respectivamente; ali a atualização foi feita, mas por disciplina da sessão, sem guardrail.)",
  "Ao escrever um teste que prova uma CORREÇÃO (defeito achado neste passo) ou que cobre um contrato de acessibilidade, prove que ele é NÃO-VACUOSO antes de declará-lo pronto: reverta cirurgicamente a correção (ou quebre a propriedade), veja o teste FALHAR, restaure e confirme `git diff` limpo do arquivo de produção. Registre o experimento nas Debug Log References da story. (Retro Epic 13: o hábito achou, num único épico, dois asserts vazios/incompletos e um assert que media a coisa errada — todos com nome de teste correto; e na 13.4 separou 'controle fora do viewport' de 'controle encoberto', que pareciam o mesmo assert.)",
]
