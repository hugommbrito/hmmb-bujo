          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyRecurringSource'
          description: ''
  /api/bujo/rituals/weekly/density/:
    get:
      operationId: bujo_rituals_weekly_density_retrieve
      description: |-
        Densidade real do Weekly-alvo (AC6) — endpoint NOVO.

        `GET /api/bujo/task-density/` fica intocado em rota, forma e semântica: são
        dois contratos distintos (ver docstring de `bujo/services/density.py`), não uma
        correção do antigo.

        NÃO exige alvo em planejamento: aceita qualquer log existente e devolve a
        grade vazia quando o log não existe, para que as Stories 14.5/14.6 (boards em
        `active`) e 14.10 (Arquivo, `finalized`) reusem o mesmo endpoint.
      parameters:
      - in: query
        name: week_start
        schema:
          type: string
          format: date
        required: true
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DensityResponse'
          description: ''
  /api/bujo/rituals/weekly/sources/monthly-in-week/:
    get:
      operationId: bujo_rituals_weekly_sources_monthly_in_week_retrieve
