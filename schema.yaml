        (400). A regra enum⇔opções no update é validada na camada de serviço contra o
        ``field_type`` atual (imutável), pois o serializer não conhece o tipo
        persistido.
      properties:
        name:
          type: string
          maxLength: 200
        enumOptions:
          type: array
          items:
            type: string
            maxLength: 200
        displayOrder:
          type: integer
          maximum: 2147483647
