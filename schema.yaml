openapi: 3.0.3
info:
  title: hmmb-bujo API
  version: 0.1.0
  description: BuJo Digital — API backend (Django REST Framework)
paths:
  /api/accounts/signup/:
    post:
      operationId: accounts_signup_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupSuccessResponse'
              examples:
                Sucesso:
                  value:
                    detail: Conta criada com sucesso.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsValidationErrorResponse'
          description: ''
  /api/accounts/token/:
    post:
      operationId: accounts_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsValidationErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsLoginFailedResponse'
          description: ''
  /api/accounts/token/refresh/:
    post:
      operationId: accounts_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsValidationErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsTokenInvalidResponse'
          description: ''
  /api/brain-dump/count/:
    get:
      operationId: brain_dump_count_retrieve
      tags:
      - brain-dump
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainDumpCount'
          description: ''
  /api/brain-dump/items/:
    get:
      operationId: brain_dump_items_list
      tags:
      - brain-dump
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrainDumpItem'
          description: ''
    post:
      operationId: brain_dump_items_create
      tags:
      - brain-dump
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrainDumpItemCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainDumpItem'
          description: ''
  /api/brain-dump/items/{id}/:
    patch:
      operationId: brain_dump_items_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brain-dump
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBrainDumpItemUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainDumpItem'
          description: ''
    delete:
      operationId: brain_dump_items_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brain-dump
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/brain-dump/items/{id}/process/:
    post:
      operationId: brain_dump_items_process_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brain-dump
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrainDumpItemProcess'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/bujo/archive/:
    get:
      operationId: bujo_archive_list
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchiveEntry'
          description: ''
  /api/bujo/catch-up/queue/:
    get:
      operationId: bujo_catch_up_queue_retrieve
      description: |-
        ALIAS FINO de `UnifiedMigrationQueueView` (ver a seção de filas acima) —
        contrato `{monthlyTasks, weeklyTasks, dailyTasks}`.

        A única divergência de recorte em relação à fila unificada: `dailyTasks`
        EXCLUI o grupo de ontem, que é território do alias `/migration/queue/`.
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchUpQueue'
          description: ''
  /api/bujo/future-log/:
    get:
      operationId: bujo_future_log_list
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FutureLogMonthGroup'
          description: ''
  /api/bujo/future-log/horizon/:
    get:
      operationId: bujo_future_log_horizon_retrieve
      description: |-
        Trilho do Future Log do sistema novo (Story 14.7, AC2 — M08).

        View NOVA ao lado de ``FutureLogView`` (que fica intocada, contrato idêntico):
        o legado devolve só meses com item, esta devolve o horizonte fixo de 8 meses
        **inclusive os vazios** + os meses distantes que têm item. Fina como todas as
        outras — chama o serviço e serializa; nenhuma regra vive aqui.
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureLogHorizon'
          description: ''
  /api/bujo/logs/monthly/:
    get:
      operationId: bujo_logs_monthly_retrieve
      parameters:
      - in: query
        name: month_first
        schema:
          type: string
          format: date
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyLog'
          description: ''
    post:
      operationId: bujo_logs_monthly_create
      tags:
      - bujo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyTaskCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/bujo/logs/monthly/cycle/:
    get:
      operationId: bujo_logs_monthly_cycle_retrieve
      description: |-
        Ações do ciclo mensal (Story 14.1, AC8).

        `open_planning_target` não recebe alvo: ele é determinístico (mês seguinte ao
        `active`), sem escolha nem retargeting (M07).

        `get` é NOVO (Story 14.6, AC4) — mesma rota, método novo, sem rota nova:
        espelha byte-a-byte `WeeklyCycleView.get` (Story 14.5), trocando
        `weekly_cycle_readiness` por `monthly_cycle_readiness`.
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyCycleReadiness'
          description: ''
    post:
      operationId: bujo_logs_monthly_cycle_create
      description: |-
        Ações do ciclo mensal (Story 14.1, AC8).

        `open_planning_target` não recebe alvo: ele é determinístico (mês seguinte ao
        `active`), sem escolha nem retargeting (M07).

        `get` é NOVO (Story 14.6, AC4) — mesma rota, método novo, sem rota nova:
        espelha byte-a-byte `WeeklyCycleView.get` (Story 14.5), trocando
        `weekly_cycle_readiness` por `monthly_cycle_readiness`.
      tags:
      - bujo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyCycleAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyCycle'
          description: ''
  /api/bujo/logs/today/:
    get:
      operationId: bujo_logs_today_retrieve
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
          description: ''
  /api/bujo/logs/weekly/:
    get:
      operationId: bujo_logs_weekly_retrieve
      parameters:
      - in: query
        name: week_start
        schema:
          type: string
          format: date
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyLog'
          description: ''
    post:
      operationId: bujo_logs_weekly_create
      tags:
      - bujo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyTaskCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/bujo/logs/weekly/cycle/:
    get:
      operationId: bujo_logs_weekly_cycle_retrieve
      description: |-
        Ações do ciclo semanal (Story 14.1, AC8) — espelha `tasks/<pk>/transition/`.

        Erros de gate e de matriz sobem como `InvalidTransition`/`CycleTargetConflict`
        (ambos `DomainError`) e viram 409 pelo handler central; nada é tratado aqui.

        `get` é NOVO (Story 14.5, AC4) — mesma rota, método novo, sem rota nova:
        leitura pura e agregada de prontidão do ciclo (qual semana está `active`/
        `planning`, quais gates de `start`/`finalize` faltam). Zero regra de
        domínio na view: `weekly_cycle_readiness` decide tudo.
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyCycleReadiness'
          description: ''
    post:
      operationId: bujo_logs_weekly_cycle_create
      description: |-
        Ações do ciclo semanal (Story 14.1, AC8) — espelha `tasks/<pk>/transition/`.

        Erros de gate e de matriz sobem como `InvalidTransition`/`CycleTargetConflict`
        (ambos `DomainError`) e viram 409 pelo handler central; nada é tratado aqui.

        `get` é NOVO (Story 14.5, AC4) — mesma rota, método novo, sem rota nova:
        leitura pura e agregada de prontidão do ciclo (qual semana está `active`/
        `planning`, quais gates de `start`/`finalize` faltam). Zero regra de
        domínio na view: `weekly_cycle_readiness` decide tudo.
      tags:
      - bujo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyCycleAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyCycle'
          description: ''
  /api/bujo/migration/queue/:
    get:
      operationId: bujo_migration_queue_retrieve
      description: |-
        ALIAS FINO de `UnifiedMigrationQueueView` — contrato `{logDate, tasks}`.

        `log_date` vem de `queue["yesterday"]`, pronto do serviço: o alias não
        recalcula tempo por conta própria, o que elimina a chance de incoerência se a
        virada do dia cair entre duas leituras — e é o que torna satisfazível o guard
        de "zero query própria" (o nome da função de calendário nem aparece aqui).
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationQueue'
          description: ''
  /api/bujo/migration/unified-queue/:
    get:
      operationId: bujo_migration_unified_queue_retrieve
      description: |-
        Fila única de pendências dos três níveis, mês → semana → dia.

        View fina e sem query param: a fila é sempre "tudo que ficou atrás de hoje"
        (AD-09 item 8 — apresenta tudo, item a item, sem janela nem paginação).
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedMigrationQueue'
          description: ''
  /api/bujo/monthly-review/queue/:
    get:
      operationId: bujo_monthly_review_queue_retrieve
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReviewQueue'
          description: ''
  /api/bujo/recurring-templates/:
    get:
      operationId: bujo_recurring_templates_list
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringTaskTemplate'
          description: ''
    post:
      operationId: bujo_recurring_templates_create
      tags:
      - bujo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringTaskTemplateCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringTaskTemplate'
          description: ''
  /api/bujo/recurring-templates/{id}/:
    patch:
      operationId: bujo_recurring_templates_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bujo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRecurringTaskTemplateUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringTaskTemplate'
          description: ''
    delete:
      operationId: bujo_recurring_templates_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bujo
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/bujo/recurring-templates/{id}/place/:
    post:
      operationId: bujo_recurring_templates_place_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bujo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringTaskTemplatePlace'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/bujo/ritual-decisions/:
    post:
      operationId: bujo_ritual_decisions_create
      description: |-
        `POST /api/bujo/ritual-decisions/` — persistência imediata, um POST por
        decisão (AD-28 item 6 ponto 6): pausar ou sair do ritual não perde nada.

        O serializer valida FORMA (400). A matriz de combinação legal levanta
        `InvalidRitualDecision` e o alvo fora de `planning` levanta
        `InvalidTransition` — ambas `DomainError`, ambas 409 pelo handler central,
        nenhuma tratada aqui.
      tags:
      - bujo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RitualDecisionCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RitualDecision'
          description: ''
  /api/bujo/rituals/monthly/density/:
    get:
      operationId: bujo_rituals_monthly_density_retrieve
      description: Densidade real do Monthly-alvo (AC6) — endpoint NOVO, gêmeo do
