      description: |-
        Série de evolução de UM campo numérico (Story 7.3, AC2):
        ``GET /api/health-logs/series/?field=<uuid>&start=&end=``.

        ``field`` é obrigatório (ausente → 400). Campo **não-numérico** → ``DomainError``
        (409); ``field`` inexistente/cross-tenant (ou UUID malformado) → 404. Read-only
        via cast JSONB — nenhuma materialização.
      parameters:
      - in: query
        name: end
        schema:
          type: string
        description: Fim do intervalo (YYYY-MM-DD). Default = hoje do usuário.
      - in: query
        name: field
        schema:
          type: string
        description: UUID do campo numérico (integer/decimal) a plotar.
        required: true
      - in: query
        name: start
        schema:
          type: string
        description: Início do intervalo (YYYY-MM-DD). Default = fim − 29 dias.
      tags:
      - health-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFieldSeries'
          description: ''
  /api/medications/:
    get:
      operationId: medications_list
      parameters:
      - in: query
        name: onDate
        schema:
          type: string
        description: Data do estado vigente (YYYY-MM-DD). Default = hoje do usuário.
      tags:
      - medications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medication'
          description: ''
    post:
      operationId: medications_create
      tags:
      - medications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
          description: ''
  /api/medications/{id}/:
    get:
      operationId: medications_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - medications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
          description: ''
    patch:
      operationId: medications_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - medications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMedicationUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
          description: ''
  /api/medications/{id}/schedule-versions/:
    post:
      operationId: medications_schedule_versions_create
      description: |-
        Set/deactivate da agenda de um bloco (eixo agenda, AC3/AC5): ``POST
        /api/medications/{id}/schedule-versions/``. ``DomainError`` (dose inválida ou
        sem dose para herdar) → 409; bloco inexistente/cross-tenant → 400.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - medications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleVersionCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationScheduleVersion'
          description: ''
  /api/medications/{id}/substance-versions/:
    post:
      operationId: medications_substance_versions_create
      description: |-
        Nova versão de substância (eixo substância, AC4): ``POST
        /api/medications/{id}/substance-versions/``.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - medications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstanceVersionCreate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationSubstanceVersion'
          description: ''
  /api/medications/days/:
    get:
      operationId: medications_days_retrieve
      description: |-
        Superfície diária: ``GET`` materializa (idempotente) as linhas ``scheduled`` do
        dia e retorna ``{date, blocks, adHoc}`` (default = hoje). Molde ``HabitDayView``.
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Dia da superfície (YYYY-MM-DD). Default = hoje do usuário.
      tags:
      - medications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationDay'
          description: ''
  /api/medications/days/{id}/:
    patch:
      operationId: medications_days_partial_update
      description: |-
        Edição retroativa de **uma** linha (AC4/AC5/AC6): confirma/desconfirma e/ou
        corrige a dose. Devolve o read-model do dia da linha. ``DoesNotExist`` (inclusive
        cross-tenant) → 404 (esconde existência); ``DomainError`` (dose inválida) → 409
        (propaga ao ``custom_exception_handler``, como ``MedicationScheduleVersionCreateView``);
        body sem ``confirmed`` nem ``dose`` → 400 (guard do ``EntryConfirmSerializer``).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - medications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEntryConfirm'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationDay'
          description: ''
  /api/medications/days/ad-hoc/:
    post:
      operationId: medications_days_ad_hoc_create
      description: |-
        Registra um avulso/PRN no dia (AC7). Medicamento inexistente/cross-tenant → 404;
        bloco inexistente → 400; ``DomainError`` (dose ausente sem agenda para herdar) → 409
        (propaga ao ``custom_exception_handler``, como ``MedicationScheduleVersionCreateView``).
        Devolve o read-model do dia atualizado.
      tags:
      - medications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdHocCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationDay'
          description: ''
  /api/medications/days/confirm-block/:
    post:
      operationId: medications_days_confirm_block_create
      description: |-
        Confirma/desconfirma o **bloco inteiro** no dia (AC4, escrita em lote). Devolve
        o read-model do dia atualizado.
      tags:
      - medications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockConfirm'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationDay'
          description: ''
  /api/summary/today:
    get:
      operationId: summary_today_retrieve
      description: |-
        Resumo do dia (`GET /api/summary/today`, AC1/AC3).

        View fina (§6.2) e **somente leitura**: compõe o resumo via `build_today_summary`
        (3 apps de domínio, read-only) → serializa a resposta agregada. Mesma espinha da
        `CaptureView`: auth por token opt-in per-view + escopo `summary` + `ScopedRateThrottle`
        (`automation-summary`) + log estruturado de auditoria. **Sem payload de entrada** →
        não há caminho 400 de validação; só 200 (+ 401/403/429 antes/fora do handler).
      tags:
      - summary
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
          description: ''
  /api/time-blocks/:
    get:
      operationId: time_blocks_list
      parameters:
      - in: query
        name: includeInactive
        schema:
          type: boolean
        description: Inclui blocos com active=false (desativados).
      tags:
      - time-blocks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeBlock'
          description: ''
    post:
      operationId: time_blocks_create
      tags:
      - time-blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeBlockCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeBlock'
          description: ''
  /api/time-blocks/{id}/:
    patch:
      operationId: time_blocks_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - time-blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTimeBlockUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeBlock'
          description: ''
components:
  schemas:
    AccountsLoginFailedResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AccountsTokenErrorCode:
      type: object
      properties:
        code:
          type: array
          items:
            type: string
      required:
      - code
    AccountsTokenInvalidResponse:
      type: object
      properties:
        detail:
          type: string
        fields:
          $ref: '#/components/schemas/AccountsTokenErrorCode'
      required:
      - detail
    AccountsValidationErrorResponse:
      type: object
      properties:
        detail:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - detail
    AdHocCreate:
      type: object
      description: |-
        POST de registro de avulso/PRN (AC7). ``time_block_id``/``dose`` opcionais:
        ``dose`` omitida herda da agenda vigente (se houver bloco), senão o serviço exige
        (``DomainError`` → 409). Só valida **forma** (``dose`` é lista quando informada); o
        conteúdo é validado no serviço (``_validate_dose``, §6.4).
      properties:
        date:
          type: string
          format: date
        medicationId:
          type: string
          format: uuid
        timeBlockId:
          type: string
          format: uuid
          nullable: true
        dose:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: number
              unit:
                type: string
      required:
      - date
      - medicationId
    ArchiveEntry:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        weekStart:
          type: string
          format: date
          nullable: true
        monthFirst:
          type: string
          format: date
          nullable: true
      required:
      - type
    BlankEnum:
      enum:
      - ''
    BlockConfirm:
      type: object
      description: POST de confirmação em lote de um bloco no dia (AC4).
      properties:
        date:
          type: string
          format: date
        timeBlockId:
          type: string
          format: uuid
        confirmed:
          type: boolean
      required:
      - confirmed
      - date
      - timeBlockId
    BlockingTaskSource:
      type: object
      description: |-
        `previous-weekly`/`previous-monthly`: acrescentam `readyToFinalize` e,
        aditivamente (Story 14.5, AC4), `previousPeriodStart` — a chave de período
        do log anterior, nome neutro porque serve as duas fontes.
      properties:
        sourceId:
          type: string
        blocking:
          type: boolean
        countsTowardProgress:
          type: boolean
        eligibleCount:
          type: integer
        pendingDecisionCount:
          type: integer
        reviewed:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/RitualTaskItem'
        readyToFinalize:
          type: boolean
        previousPeriodStart:
          type: string
          format: date
          nullable: true
      required:
      - blocking
      - countsTowardProgress
      - eligibleCount
      - items
      - pendingDecisionCount
      - previousPeriodStart
      - readyToFinalize
      - reviewed
      - sourceId
    BrainDumpCount:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    BrainDumpItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 500
        description:
          type: string
          nullable: true
        targetLog:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TargetLogEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - id
      - title
    BrainDumpItemCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
          nullable: true
        targetLog:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TargetLogEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - title
    BrainDumpItemProcess:
      type: object
      properties:
        destination:
          $ref: '#/components/schemas/BrainDumpItemProcessDestinationEnum'
        monthFirst:
          type: string
          format: date
        scheduledDate:
          type: string
          format: date
          nullable: true
      required:
      - destination
    BrainDumpItemProcessDestinationEnum:
      enum:
      - today
      - week
      - month
      - future
      type: string
      description: |-
        * `today` - today
        * `week` - week
        * `month` - month
        * `future` - future
    CaptureRequest:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
          maxLength: 500
        value:
          type: string
          nullable: true
      required:
      - text
      - type
    CaptureResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
      required:
      - id
    CatchUpQueue:
      type: object
      properties:
        monthlyTasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        weeklyTasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        dailyTasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
      - dailyTasks
      - monthlyTasks
      - weeklyTasks
    CategoryEnum:
      enum:
      - teal
      - purple
      - pink
      - yellow
      - green
      - blue
      type: string
      description: |-
        * `teal` - Teal
        * `purple` - Purple
        * `pink` - Pink
        * `yellow` - Yellow
        * `green` - Green
        * `blue` - Blue
    DayTypeEnum:
      enum:
      - weekday
      - weekend
      - holiday
      type: string
      description: |-
        * `weekday` - Weekday
        * `weekend` - Weekend
        * `holiday` - Holiday
    DecisionEnum:
      enum:
      - keep
      - skip_week
      - keep_undated
      type: string
      description: |-
        * `keep` - Keep
        * `skip_week` - Skip Week
        * `keep_undated` - Keep Undated
    DensityCell:
      type: object
      properties:
        total:
          type: integer
        byStatus:
          $ref: '#/components/schemas/DensityStatusBreakdown'
      required:
      - byStatus
      - total
    DensityDay:
      type: object
      properties:
        total:
          type: integer
        byStatus:
          $ref: '#/components/schemas/DensityStatusBreakdown'
        date:
          type: string
          format: date
      required:
      - byStatus
      - date
      - total
    DensityResponse:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/DensityDay'
        undated:
          $ref: '#/components/schemas/DensityCell'
        total:
          type: integer
      required:
      - days
      - total
      - undated
    DensityStatusBreakdown:
      type: object
      description: |-
        As 6 chaves de `TaskStatus`, SEMPRE presentes (zeros inclusive).

        Nenhuma tem underscore, então a camelização de saída não as altera — o que é
        verificado por teste de fio, não deduzido.
      properties:
        pending:
          type: integer
        started:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
        migrated:
          type: integer
        postponed:
          type: integer
      required:
      - cancelled
      - completed
      - migrated
      - pending
      - postponed
      - started
    Doctor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        specialty:
          type: string
          nullable: true
          maxLength: 200
      required:
      - id
      - name
    DoctorCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        specialty:
          type: string
          nullable: true
          maxLength: 200
      required:
      - name
    EisenhowerEnum:
      enum:
      - ui
      - u
      - i
      - none
      type: string
      description: |-
        * `ui` - Urgent Important
        * `u` - Urgent
        * `i` - Important
        * `none` - None
    FutureLogHorizon:
      type: object
      properties:
        anchorMonthFirst:
          type: string
          format: date
        horizon:
          type: array
          items:
            $ref: '#/components/schemas/FutureLogMonthCount'
        distant:
          type: array
          items:
            $ref: '#/components/schemas/FutureLogMonthCount'
      required:
      - anchorMonthFirst
      - distant
      - horizon
    FutureLogMonthCount:
      type: object
      properties:
        monthFirst:
          type: string
          format: date
        taskCount:
          type: integer
      required:
      - monthFirst
      - taskCount
    FutureLogMonthGroup:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
      - month
      - tasks
      - year
    GratitudeDay:
      type: object
      description: 'Read-model da data (AC3): a data + a lista de entradas daquela
        data.'
      properties:
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/GratitudeEntry'
      required:
      - date
      - entries
    GratitudeEntry:
      type: object
      description: |-
        Saída de uma entrada (leitura). ``created_at`` (ISO timestamptz) → ``createdAt``
        na borda; a hora é derivada dele no frontend.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        text:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - date
      - id
      - text
    GratitudeEntryWrite:
      type: object
      description: |-
        Entrada de criação (AC1/AC4). Só valida **forma**: ``text`` não-branco
        (``trim_whitespace`` → texto só-espaços vira vazio → ``allow_blank=False`` → 400);
        ``date`` opcional (ausente → o servidor resolve para ``today_for(user)``, AD-04).
      properties:
        text:
          type: string
        date:
          type: string
          format: date
      required:
      - text
    GratitudeMonth:
      type: object
      description: |-
        Read-model do mês (9.2 AC1/AC2): o mês (dia 1) + os dias com entradas. Cada dia
        é um read-model diário → **reusa** ``GratitudeDaySerializer`` (mesmo shape, um nível
        acima). Sem envelope; ``createdAt`` na borda (herdado do serializer de entrada).
      properties:
        month:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/GratitudeDay'
      required:
      - days
      - month
    GroupMultipliers:
      type: object
      description: |-
        Config vigente do grupo (read): chaves nomeadas ``weekend``/``holiday``.

        Sem enum ``day_type`` no wire (evita colisão de ``DayTypeEnum`` — ver Dev Notes
        da story). ``weekday`` nunca aparece (= 1.0 implícito).
      properties:
        weekend:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        holiday:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
      required:
      - holiday
      - weekend
    Habit:
      type: object
      description: Hábito + campos da versão vigente hoje (``obj.current_version``).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        emoticon:
          type: string
          maxLength: 16
        iconKey:
          type: string
          nullable: true
          maxLength: 64
        group:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/HabitTypeEnum'
        unit:
          type: string
          maxLength: 32
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
        active:
          type: boolean
          readOnly: true
        meta:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        bonus:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        effectiveFrom:
          type: string
          format: date
          readOnly: true
      required:
      - active
      - bonus
      - effectiveFrom
      - group
      - id
      - meta
      - name
      - type
      - weight
    HabitChange:
      type: object
      description: |-
        Uma mudança real de config no diff de versões. ``field`` = **CharField**
        (weight/meta/bonus/active/created) — NÃO ChoiceField, para não emitir enum novo.
        ``before``/``after`` — **NUNCA** ``from``/``to`` (``from`` é reservada em Python);
        string (allow_null) por serem valores heterogêneos (decimais/booleanos).
      properties:
        field:
          type: string
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
      required:
      - after
      - before
      - field
    HabitCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        emoticon:
          type: string
          default: ''
          maxLength: 16
        unit:
          type: string
          default: ''
          maxLength: 32
        iconKey:
          type: string
          nullable: true
          maxLength: 64
        group:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/HabitTypeEnum'
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        meta:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        bonus:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
      required:
      - group
      - name
      - type
      - weight
    HabitDay:
      type: object
      description: 'Payload do tracker do dia: % total, % por grupo, tipo do dia e
        as linhas.'
      properties:
        date:
          type: string
          format: date
        totalCompletion:
          type: integer
        dayType:
          $ref: '#/components/schemas/DayTypeEnum'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/HabitDayGroup'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/HabitDayEntry'
      required:
      - date
      - dayType
      - entries
      - groups
      - totalCompletion
    HabitDayEntry:
      type: object
      description: |-
        Uma linha do tracker do dia: identidade do hábito + snapshot congelado.

        Expõe a identidade do hábito (``name``/``emoticon``/``icon_key``/``type``/``group``/``unit``)
        junto do estado do dia (``value``/``*_at_time``). ``type`` reusa ``HabitTypeEnum``
        via ``ChoiceField`` (mesmo override de enum da 6.1).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        habitId:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        emoticon:
          type: string
          readOnly: true
        iconKey:
          type: string
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/HabitTypeEnum'
          readOnly: true
        group:
          type: string
          format: uuid
          readOnly: true
        unit:
          type: string
          readOnly: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        weightAtTime:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        metaAtTime:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        bonusAtTime:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        dayType:
          allOf:
          - $ref: '#/components/schemas/DayTypeEnum'
          readOnly: true
        multiplierAtTime:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
      required:
      - dayType
      - emoticon
      - group
      - habitId
      - iconKey
      - id
      - name
      - type
      - unit
      - weightAtTime
    HabitDayGroup:
      type: object
      description: 'Cabeçalho de grupo do tracker: nome + % ponderado do grupo.'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        completion:
          type: integer
      required:
      - completion
      - id
      - name
    HabitDayType:
      type: object
      description: |-
        Tipo de dia de um dia de calendário do range (para o sombreamento de ritmo,
        inclusive em dias-lacuna). Reusa ``DayTypeEnum``.
      properties:
        date:
          type: string
          format: date
        dayType:
          $ref: '#/components/schemas/DayTypeEnum'
      required:
      - date
      - dayType
    HabitGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        displayOrder:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - name
    HabitGroupCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
      required:
      - name
    HabitHistoryDay:
      type: object
      description: |-
        Um dia no range de histórico. ``total_completion`` **allow_null** = lacuna
        honesta (dia nunca aberto); ``groups`` traz o % ponderado POR GRUPO (AC1).
      properties:
        date:
          type: string
          format: date
        dayType:
          $ref: '#/components/schemas/DayTypeEnum'
        totalCompletion:
          type: integer
          nullable: true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/HabitDayGroup'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/HabitDayEntry'
      required:
      - date
      - dayType
      - entries
      - groups
      - totalCompletion
    HabitHistoryRange:
      type: object
      description: 'Payload do intervalo: alimenta a grade hábitos × dias e o detalhe
        por-data.'
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        habits:
          type: array
          items:
            $ref: '#/components/schemas/HabitSlim'
        days:
          type: array
          items:
            $ref: '#/components/schemas/HabitHistoryDay'
      required:
      - days
      - end
      - habits
      - start
    HabitSeries:
      type: object
      description: Série + eventos + ritmo de UM hábito no range.
      properties:
        habit:
          $ref: '#/components/schemas/HabitSlim'
        points:
          type: array
          items:
            $ref: '#/components/schemas/HabitSeriesPoint'
        events:
          type: array
          items:
            $ref: '#/components/schemas/HabitVersionEvent'
        dayTypes:
          type: array
          items:
            $ref: '#/components/schemas/HabitDayType'
      required:
      - events
      - habit
      - points
    HabitSeriesPoint:
      type: object
      description: |-
        Um ponto diário da série: ``value`` (allow_null), ``effective_weight`` e o
        ``day_type`` congelado da linha (reusa ``DayTypeEnum``).
      properties:
        date:
          type: string
          format: date
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        effectiveWeight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        dayType:
          $ref: '#/components/schemas/DayTypeEnum'
      required:
      - date
      - dayType
      - effectiveWeight
      - value
    HabitSlim:
      type: object
      description: |-
        Identidade do hábito para history/series — **sem** ``current_version``.

        Os serviços de histórico derivam identidade de ``entry.habit``/``habit`` (Habit
        puro, sem ``current_version`` anexada). ``HabitSerializer`` estouraria
        ``AttributeError`` (lê ``current_version.weight`` etc.), por isso este slim.
        ``type`` reusa ``HabitTypeEnum`` (já pinado); nenhum enum novo.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        emoticon:
          type: string
          maxLength: 16
        iconKey:
          type: string
          nullable: true
          maxLength: 64
        type:
          allOf:
          - $ref: '#/components/schemas/HabitTypeEnum'
          readOnly: true
        unit:
          type: string
          maxLength: 32
        group:
          type: string
          format: uuid
          readOnly: true
      required:
      - group
      - id
      - name
      - type
    HabitTypeEnum:
      enum:
      - boolean
      - numeric
      type: string
      description: |-
        * `boolean` - Boolean
        * `numeric` - Numeric
    HabitVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        habit:
          type: string
          format: uuid
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        active:
          type: boolean
        meta:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        bonus:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        effectiveFrom:
          type: string
          format: date
      required:
      - effectiveFrom
      - habit
      - id
      - weight
    HabitVersionCreate:
      type: object
      description: |-
        Nova versão prospectiva: mudança de peso/meta/bonus e/ou desativar/reativar.

        Todos os campos são opcionais — os não informados herdam da versão vigente.
      properties:
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        meta:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        bonus:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        active:
          type: boolean
    HabitVersionEvent:
      type: object
      description: Um marcador datado de mudança real (uma transição de versão).
      properties:
        effectiveFrom:
          type: string
          format: date
        changes:
          type: array
          items:
            $ref: '#/components/schemas/HabitChange'
      required:
      - changes
      - effectiveFrom
    HealthDaily:
      type: object
      description: |-
        Read-model do ritual matinal (AC3): ``{yesterday, today, fields}``.

        ``yesterday``/``today`` são ``{date, values}`` (datas resolvidas pelo servidor via
        ``today_for``); ``fields`` são as definições **ativas** (reuso do serializer de
        7.1). ``fields`` é um nome de field declarado — o ``SerializerMetaclass`` o move
        para ``_declared_fields`` (``attrs.pop``), então não colide com a property
        ``Serializer.fields``.
      properties:
        yesterday:
          $ref: '#/components/schemas/HealthDaySection'
        today:
          $ref: '#/components/schemas/HealthDaySection'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/HealthFieldDefinition'
      required:
      - fields
      - today
      - yesterday
    HealthDaySection:
      type: object
      description: 'Uma seção do ritual (``yesterday``/``today``): a data + os valores
        do dia.'
      properties:
        date:
          type: string
          format: date
        values:
          type: object
          additionalProperties:
            anyOf:
            - type: number
            - type: boolean
            - type: string
      required:
      - date
      - values
    HealthFieldCreate:
      type: object
      description: Entrada de criação (AC1, AC3). Valida a regra enum⇔opções (→ 400).
      properties:
        name:
          type: string
          maxLength: 200
        fieldType:
          $ref: '#/components/schemas/HealthFieldTypeEnum'
        enumOptions:
          type: array
          items:
            type: string
            maxLength: 200
        displayOrder:
          type: integer
          maximum: 2147483647
          minimum: 0
        iconKey:
          type: string
          nullable: true
          maxLength: 64
      required:
      - fieldType
      - name
    HealthFieldDefinition:
      type: object
      description: 'Saída: a definição de campo. ``field_type`` emite ``HealthFieldTypeEnum``.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        fieldType:
          $ref: '#/components/schemas/HealthFieldTypeEnum'
        enumOptions:
          type: array
          items:
            type: string
          readOnly: true
        active:
          type: boolean
        displayOrder:
          type: integer
          maximum: 2147483647
          minimum: 0
        iconKey:
          type: string
          nullable: true
          maxLength: 64
      required:
      - enumOptions
      - fieldType
      - id
      - name
    HealthFieldSeries:
      type: object
      description: |-
        Payload de ``GET /api/health-logs/series/``: a definição do campo + a série.

        ``field`` **reusa** ``HealthFieldDefinitionSerializer`` (7.1). A tabela do
        ``history`` é a representação equivalente acessível deste gráfico (AC4).
      properties:
        field:
          $ref: '#/components/schemas/HealthFieldDefinition'
        points:
          type: array
          items:
            $ref: '#/components/schemas/HealthSeriesPoint'
      required:
      - field
      - points
    HealthFieldTypeEnum:
      enum:
      - integer
      - decimal
      - boolean
      - enum
      - text
      type: string
      description: |-
        * `integer` - Integer
        * `decimal` - Decimal
        * `boolean` - Boolean
        * `enum` - Enum
        * `text` - Text
    HealthHistory:
      type: object
      description: |-
        Payload de ``GET /api/health-logs/history/``: tabela dia a dia + dashboard.

        ``fields`` **reusa** ``HealthFieldDefinitionSerializer`` (7.1) — inclui campos
        ativos e inativos-com-histórico (Decisão 3). ``days`` = uma entrada por linha
        existente. ``summary`` = um cartão por campo numérico.
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        fields:
          type: array
          items:
            $ref: '#/components/schemas/HealthFieldDefinition'
        days:
          type: array
          items:
            $ref: '#/components/schemas/HealthHistoryDay'
        summary:
          type: array
          items:
            $ref: '#/components/schemas/HealthPeriodSummary'
      required:
      - days
      - end
      - fields
      - start
      - summary
    HealthHistoryDay:
      type: object
      description: |-
        Uma linha de ``health_logs`` no range: a data + o blob opaco de valores.

        ``values`` **reusa** ``HealthValuesField`` (§6.10): dict de chave dinâmica (UUID
        da definição) que NÃO é camelizado na borda. O frontend tipa cada célula pela
        definição viva (``fields``), não por esquema estruturado.
      properties:
        date:
          type: string
          format: date
        values:
          type: object
          additionalProperties:
            anyOf:
            - type: number
            - type: boolean
            - type: string
      required:
      - date
      - values
    HealthLog:
      type: object
      description: 'Saída de uma linha upsertada (resposta do ``PUT``): ``{id, date,
        values}``.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        values:
          type: object
          additionalProperties:
            anyOf:
            - type: number
            - type: boolean
            - type: string
      required:
      - date
      - id
      - values
    HealthLogWrite:
      type: object
      description: |-
        Entrada do ``PUT`` (AC1): ``{date, values}``. Só valida **forma**.

        O conteúdo de ``values`` (tipo por campo, UUID ativo, atomicidade) é validado na
        camada de serviço (``upsert_health_log``) contra as definições do tenant (§6.4).
      properties:
        date:
          type: string
          format: date
        values:
          type: object
          additionalProperties:
            anyOf:
            - type: number
            - type: boolean
            - type: string
      required:
      - date
      - values
    HealthPeriodSummary:
      type: object
      description: |-
        Cartão do dashboard de período de UM campo numérico (AC2, Decisão 7/8).

        Números crus (não string). ``min``/``max``/``avg``/``latest`` são ``allow_null``
        = campo sem nenhum registro no range (o frontend mostra "—").
      properties:
        fieldId:
          type: string
          format: uuid
        count:
          type: integer
        min:
          type: number
          format: double
          nullable: true
        max:
          type: number
          format: double
          nullable: true
        avg:
          type: number
          format: double
          nullable: true
        latest:
          type: number
          format: double
          nullable: true
      required:
      - avg
      - count
      - fieldId
      - latest
      - max
      - min
    HealthSeriesPoint:
      type: object
      description: |-
        Um ponto diário ``(data, valor)`` da série de evolução (AC2). ``value`` cru
        (``FloatField``); dias sem a chave já vêm **omitidos** do serviço (não null).
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          format: double
          nullable: true
      required:
      - date
      - value
    HolidayResult:
      type: object
      description: 'Resultado do toggle de feriado: a data + o tipo de dia re-resolvido.'
      properties:
        date:
          type: string
          format: date
        dayType:
          $ref: '#/components/schemas/DayTypeEnum'
      required:
      - date
      - dayType
    Log:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        logDate:
          type: string
          format: date
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          readOnly: true
      required:
      - id
      - logDate
      - tasks
    Medication:
      type: object
      description: |-
        Medicamento + estado vigente hoje (anotado pela camada de serviço).

        ``active`` é **derivado** (``medications`` não tem coluna ``active``, AC5):
        ``obj.derived_active`` vem do serviço. ``substance`` = versão de substância vigente
        (ou null); ``schedules`` = versões de agenda vigentes por bloco ativo.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        active:
          type: boolean
          readOnly: true
        substance:
          allOf:
          - $ref: '#/components/schemas/MedicationSubstanceVersion'
          readOnly: true
          nullable: true
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/MedicationScheduleVersion'
          readOnly: true
      required:
      - active
      - id
      - schedules
      - substance
      - title
    MedicationCreate:
      type: object
      description: |-
        Entrada de criação (AC1): slot ``title`` + primeira versão de substância.

        A agenda por bloco é definida em passo separado (``set_schedule``), espelhando as
        ACs ("cadastra um medicamento" vs. "define a agenda de doses"; Decisão 2).
      properties:
        title:
          type: string
          maxLength: 200
        substanceName:
          type: string
          maxLength: 200
        laboratory:
          type: string
          nullable: true
          maxLength: 200
        prescribedById:
          type: string
          format: uuid
          nullable: true
      required:
      - substanceName
      - title
    MedicationDay:
      type: object
      description: 'Payload da superfície diária: blocos agendados + seção avulso/PRN
        (AC4/AC7).'
      properties:
        date:
          type: string
          format: date
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/MedicationDayBlock'
        adHoc:
          type: array
          items:
            $ref: '#/components/schemas/MedicationDayEntry'
      required:
      - adHoc
      - blocks
      - date
    MedicationDayBlock:
      type: object
      description: |-
        Um Medication Block do dia: cabeçalho (nome + estado derivado) + suas linhas
        ``scheduled`` (AC5/AC6).
      properties:
        timeBlockId:
          type: string
          format: uuid
        timeBlockName:
          type: string
        status:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MedicationDayEntry'
      required:
      - entries
      - status
      - timeBlockId
      - timeBlockName
    MedicationDayEntry:
      type: object
      description: |-
        Uma linha realizada do dia (``scheduled`` ou ``ad_hoc``). ``substanceName`` é
        derivado da versão de substância vigente no dia; ``confirmedAt`` nulo = não
        confirmado; ``timeBlockId`` nulo = avulso sem bloco (AC4/AC7).
      properties:
        id:
          type: string
          format: uuid
        medicationId:
          type: string
          format: uuid
        medicationTitle:
          type: string
        substanceName:
          type: string
          nullable: true
        doseAtTime:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: number
              unit:
                type: string
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        timeBlockId:
          type: string
          format: uuid
          nullable: true
      required:
      - confirmedAt
      - doseAtTime
      - id
      - medicationId
      - medicationTitle
      - source
      - substanceName
      - timeBlockId
    MedicationScheduleVersion:
      type: object
      description: |-
        Saída de uma versão de agenda vigente/criada (eixo agenda). ``dose`` é o array
        tipado; ``time_block_name`` acompanha para a tela renderizar sem uma query extra.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        medication:
          type: string
          format: uuid
        timeBlock:
          type: string
          format: uuid
        timeBlockName:
          type: string
          readOnly: true
        dose:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: number
              unit:
                type: string
        active:
          type: boolean
        effectiveFrom:
          type: string
          format: date
      required:
      - dose
      - effectiveFrom
      - id
      - medication
      - timeBlock
      - timeBlockName
    MedicationSubstanceVersion:
      type: object
      description: Saída de uma versão de substância vigente/criada (eixo substância).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        medication:
          type: string
          format: uuid
        substanceName:
          type: string
          maxLength: 200
        laboratory:
          type: string
          nullable: true
          maxLength: 200
        prescribedBy:
          type: string
          format: uuid
          nullable: true
        effectiveFrom:
          type: string
          format: date
      required:
      - effectiveFrom
      - id
      - medication
      - substanceName
    MigrationQueue:
      type: object
      properties:
        logDate:
          type: string
          format: date
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
      - logDate
      - tasks
    MigrationTarget:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MigrationTargetTypeEnum'
        weekStart:
          type: string
          format: date
          nullable: true
        monthFirst:
          type: string
          format: date
          nullable: true
        logDate:
          type: string
          format: date
          nullable: true
      required:
      - type
    MigrationTargetTypeEnum:
      enum:
      - daily
      - weekly
      - monthly
      type: string
      description: |-
        * `daily` - daily
        * `weekly` - weekly
        * `monthly` - monthly
    MonthlyCycle:
      type: object
      properties:
        status:
          type: string
          nullable: true
        planningCompletedAt:
          type: string
          format: date-time
          nullable: true
        monthFirst:
          type: string
          format: date
        regularWindowStart:
          type: string
          format: date
        regularWindowEnd:
          type: string
          format: date
      required:
      - monthFirst
      - planningCompletedAt
      - regularWindowEnd
      - regularWindowStart
      - status
    MonthlyCycleAction:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/MonthlyCycleActionActionEnum'
        monthFirst:
          type: string
          format: date
      required:
      - action
    MonthlyCycleActionActionEnum:
      enum:
      - open_planning_target
      - complete_planning
      - start
      - finalize
      type: string
      description: |-
        * `open_planning_target` - open_planning_target
        * `complete_planning` - complete_planning
        * `start` - start
        * `finalize` - finalize
    MonthlyCycleReadiness:
      type: object
      description: |-
        Resposta de `GET /api/bujo/logs/monthly/cycle/` (AC4) — os quatro blocos,
        `null` nos inexistentes. Cada booleano REUSA o predicado do serviço de
        transição (ver `services/cycles.monthly_cycle_readiness`); este serializer
        só projeta, nunca decide.
      properties:
        active:
          allOf:
          - $ref: '#/components/schemas/_MonthlyCycleSnapshot'
          nullable: true
        planning:
          allOf:
          - $ref: '#/components/schemas/_MonthlyCycleSnapshot'
          nullable: true
        start:
          allOf:
          - $ref: '#/components/schemas/MonthlyStartReadiness'
          nullable: true
        finalize:
          allOf:
