          nullable: true
        planning:
          allOf:
          - $ref: '#/components/schemas/_WeeklyCycleSnapshot'
          nullable: true
        start:
          allOf:
          - $ref: '#/components/schemas/WeeklyStartReadiness'
          nullable: true
        finalize:
          allOf:
          - $ref: '#/components/schemas/WeeklyFinalizeReadiness'
          nullable: true
