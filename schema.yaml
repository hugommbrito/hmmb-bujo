      type: object
      properties:
        name:
          type: string
          maxLength: 200
        specialty:
          type: string
          nullable: true
          maxLength: 200
    PatchedEntryConfirm:
      type: object
      description: |-
        PATCH de uma linha: corrigir a confirmação e/ou a dose (AC4/AC5/AC6).

        Aditivo sobre a 8.2 (que só tinha ``confirmed``): ganha ``dose`` opcional (correção
        retroativa da dose, AC6) e ``confirmed`` passa a ser opcional — mas **ao menos um**
        deve vir. O guard "ambos ausentes" mora no ``validate()`` e levanta
        ``ValidationError`` → **400** (não ``DomainError``/409). O conteúdo da ``dose``
        (amount numérico, unit não-vazia, lista não-vazia) é validado na camada de serviço
        (``_validate_dose``, §6.4); aqui só a **forma** (é uma lista quando informada). O nome
        da classe é mantido (contrato aditivo, sem renomear o componente do schema).
      properties:
        confirmed:
          type: boolean
        dose:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: number
              unit:
                type: string
    PatchedHabitDayEntryUpdate:
      type: object
      description: |-
        PATCH de uma linha: marcar/desmarcar ``value`` e/ou correção avulsa.

        ``value`` ``allow_null`` (desmarcar booleano → None). ``weightAtTime``/
        ``metaAtTime``/``bonusAtTime`` opcionais (correção de dia passado). ``habit``/
        ``date`` são identidade imutável do snapshot — enviá-los é rejeitado (400).
      properties:
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        weightAtTime:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        metaAtTime:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        bonusAtTime:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        multiplierAtTime:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
    PatchedHabitGroupUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
    PatchedHabitUpdate:
      type: object
      description: Atualiza identidade. ``type`` é imutável — enviá-lo é rejeitado
        (400).
      properties:
