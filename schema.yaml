          format: date
          nullable: true
          readOnly: true
        taskId:
          type: string
          format: uuid
          nullable: true
        recurringTemplateId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - decision
      - id
      - monthFirst
      - recurringTemplateId
      - taskId
      - updatedAt
      - weekStart
