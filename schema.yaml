  /api/bujo/rituals/monthly/sources/recurring/:
    get:
      operationId: bujo_rituals_monthly_sources_recurring_retrieve
      description: |-
        Base das três fontes mensais (gêmea da semanal: mecânica extraída, não
        copiada — o que diverge é o parâmetro de período e o serviço).
      parameters:
      - in: query
        name: month_first
